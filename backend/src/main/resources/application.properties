spring.profiles.default=tidb
server.port=${PORT:8080}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jwt.expiration=86400000
razorpay.key-id=${RAZORPAY_KEY_ID:your_razorpay_key_id}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
logging.level.com.artisanconnect=INFO
